# Manual only. Source and artifact bindings must be reviewed together.
name: Manual native service control qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-native-service-control
  cancel-in-progress: false
jobs:
  service-control:
    if: github.repository == 'nodus-compute/nodus-dc' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact independently reviewed package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fdfa300dd2856ac29c1464fb608eb8bfa4882e0d
          path: candidate
          persist-credentials: false
      - name: Download the published artifacts and verify their source rebuild
        run: python3 qualification/systemd/prepare.py --candidate candidate --output evidence/prepared
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify separate public nodusd release signature and protocol executable
        id: signed-agent
        continue-on-error: true # Preserve independent service observations; final assessor requires both gates.
        run: python3 qualification/systemd/verify_agent.py --output evidence/signed-agent
      - name: Install the exact wheel offline into a new owned directory
        id: install
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          root="/var/lib/nodus-dc-systemd-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo test ! -e "$root"
          sudo install -d -m 0700 "$root"
          sudo install -m 0600 qualification/systemd/systemd_fixture.py qualification/systemd/bindings.json "$root/"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
          sudo install -m 0600 candidate/tools/install.py "$root/install.py"
          sudo install -m 0600 evidence/prepared/legacy-install.py evidence/prepared/nodus_datacenter-0.1.0.dev1-py3-none-any.whl "$root/"
          sudo python3 "$root/install.py" install --prefix "$root/install" --state-dir "$root/state" \
            --wheel "$root/nodus_datacenter-0.1.0.dev1-py3-none-any.whl" > evidence/install-legacy.json
          sudo python3 "$root/install.py" install --prefix "$root/install" --state-dir "$root/state" \
            --wheel "$PWD/evidence/prepared/nodus_datacenter-0.1.0.dev3-py3-none-any.whl" > evidence/install.json
          sudo "$root/install/current/bin/nodus-dc" --version > evidence/nodus-dc-version.txt
          sudo "$root/install/current/bin/nodus-dc" native-return --help > evidence/native-return-help.txt
      - name: Actual systemd lifecycle with representative worker and installed LinuxAgent
        shell: bash
        run: |
          set -euo pipefail
          root="/var/lib/nodus-dc-systemd-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          timeout --signal=TERM --kill-after=20s 180s sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            "$root/install/current/bin/python" -I "$root/systemd_fixture.py" --root "$root"
      - name: Stop and remove only the owned fixture unit, preserve raw evidence
        if: always() && steps.install.outputs.owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="/var/lib/nodus-dc-systemd-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup=0
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            python3 -I "$root/systemd_fixture.py" --root "$root" --cleanup || cleanup=$?
          mkdir -p evidence/systemd
          if sudo test -d "$root/evidence"; then
            sudo cp -a "$root/evidence/." evidence/systemd/
            sudo chown -R "$(id -u):$(id -g)" evidence/systemd
          fi
          exit "$cleanup"
      - name: Require all exact cases, cleanup and independent artifact evidence
        if: always()
        run: python3 qualification/systemd/assess.py --evidence evidence
      - name: Retain positive and negative evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-service-control-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            !evidence/signed-agent/nodusd
            !evidence/signed-agent/nodusd.altered
          if-no-files-found: error
          retention-days: 7
