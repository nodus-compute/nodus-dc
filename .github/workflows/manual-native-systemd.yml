# Manual only. Source and artifact bindings must be reviewed together.
name: Manual native service control qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-native-service-control
  cancel-in-progress: false
jobs:
  managed-local-owner:
    if: github.repository == 'nodus-compute/nodus-dc' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/managed-local-oss-root-native-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Establish one original clock and exclusive fixture
        id: owned
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_ENV="$GITHUB_ENV" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            ML_RUNNER_UID="$(id -u)" ML_RUNNER_GID="$(id -g)" /usr/bin/python3 -B - <<'PYINIT'
          import json,os,pathlib,stat,time
          t0=time.monotonic();epoch=time.time()
          assert os.getuid()==os.geteuid()==os.getgid()==os.getegid()==0
          runner_uid=int(os.environ['ML_RUNNER_UID']);runner_gid=int(os.environ['ML_RUNNER_GID'])
          assert 0<runner_uid<2**31 and 0<runner_gid<2**31
          run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          assert run.isdigit() and attempt=='1'
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/managed-local-oss-root-native-20261119'
          assert os.environ['GITHUB_REPOSITORY']=='nodus-compute/nodus-dc'
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event.get('inputs') in (None,{}) and event['repository']['private'] is False
          base=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          out=base/f'managed-local-root-evidence-{run}-{attempt}';fixture=pathlib.Path('/root')/f'managed-local-root-fixture-{run}-{attempt}'
          assert not out.exists() and not out.is_symlink() and not fixture.exists() and not fixture.is_symlink()
          out.mkdir(mode=0o700);fixture.mkdir(mode=0o700);(fixture/'tmp').mkdir(mode=0o700)
          st=fixture.lstat();home=pathlib.Path.home().resolve();rows={};ancestry=[]
          assert home==pathlib.Path('/root') and not home.is_symlink()
          for path in [fixture/'tmp',fixture,*fixture.parents]:
              info=path.lstat()
              assert stat.S_ISDIR(info.st_mode) and info.st_uid==info.st_gid==0 and not info.st_mode&0o022
              ancestry.append({'path':str(path),'device':info.st_dev,'inode':info.st_ino,'uid':info.st_uid,'gid':info.st_gid,'mode':stat.S_IMODE(info.st_mode)})
          output=out.lstat()
          with os.scandir(home) as entries:
              for count,entry in enumerate(entries):
                  assert count<2047,'home census bound'
                  if entry.name.startswith(('.nodus-partition-','.nodus-api-')):
                      s=entry.stat(follow_symlinks=False);rows[entry.name]=[s.st_dev,s.st_ino,s.st_uid,s.st_mode]
          owner={'run_id':run,'attempt':attempt,'fixture':str(fixture),'fixture_identity':[st.st_dev,st.st_ino,st.st_uid,stat.S_IMODE(st.st_mode)],
                 'home':str(home),'home_before':rows,'root_ancestry':ancestry,'owner_uid':os.geteuid(),'owner_gid':os.getegid(),
                 'runner_uid':runner_uid,'runner_gid':runner_gid,'output_identity':[output.st_dev,output.st_ino,output.st_uid,stat.S_IMODE(output.st_mode)],'started_epoch':epoch,'started_monotonic':t0,'work_end':t0+150,'job_end':t0+240}
          (out/'ownership.json').write_text(json.dumps(owner,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env:env.write(f'OUT={out}\nFIXTURE={fixture}\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('owned=true\n')
          PYINIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Bind exact product source and six-case invocation
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            OUT="$OUT" FIXTURE="$FIXTURE" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" /usr/bin/python3 -B - <<'PYSOURCE'
          import hashlib,json,os,pathlib,platform,subprocess,sys,tarfile,time
          out=pathlib.Path(os.environ['OUT']);owner=json.loads((out/'ownership.json').read_text());root=pathlib.Path.cwd()
          product='394f3b32de15de96b7002ebc448ed608aeb9ac29';tree='072b244b09fc3b43fff9b31b52918cc0b7df9252'
          workflow='.github/workflows/manual-native-systemd.yml'
          assert os.geteuid()==os.getegid()==0 and pathlib.Path.home()==pathlib.Path('/root')
          git_argv=['git','-c','safe.directory='+str(root)]
          def git(*args):return subprocess.check_output([*git_argv,*args],timeout=10)
          assert git('rev-parse','HEAD').decode().strip()==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^').decode().strip()==product
          assert git('rev-parse',product+'^{tree}').decode().strip()==tree
          assert git('diff','--name-only',product,'HEAD').decode().splitlines()==[workflow]
          before=git('status','--porcelain=v1','--untracked-files=all');(out/'source-before.txt').write_bytes(before);assert not before
          (out/'workflow.yml').write_bytes((root/workflow).read_bytes())
          with (out/'product-source.tar').open('xb') as archive:subprocess.run([*git_argv,'archive','--format=tar',product],stdout=archive,check=True,timeout=10)
          rows=[]
          with tarfile.open(out/'product-source.tar','r:') as archive:
              for member in archive.getmembers():
                  if member.isdir():continue
                  assert member.isfile() and not pathlib.PurePosixPath(member.name).is_absolute() and '..' not in pathlib.PurePosixPath(member.name).parts
                  data=archive.extractfile(member).read();assert len(data)==member.size
                  rows.append({'path':member.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                  if member.name!=workflow:assert (root/member.name).read_bytes()==data
          assert len(rows)==212
          (out/'source-manifest.json').write_text(json.dumps({'product_head':product,'product_tree':tree,'workflow_head':os.environ['GITHUB_SHA'],'files':rows},sort_keys=True)+'\n')
          argv=['python3', '-B', '-m', 'unittest', '-v', 'tests.test_partition_authority.Partitions.test_managed_local_same_ledger_creator_demand_and_positive_retirement', 'tests.test_partition_authority.Partitions.test_qualified_creator_cas_replay_loss_and_retirement', 'tests.test_partition_authority.Partitions.test_qualified_floor8_write_ahead_loss_cannot_reopen_admission', 'tests.test_api.ApiTests.test_v2_is_bridge_only_and_rejects_unknown_fields', 'tests.test_cli.CliTests.test_managed_cli_uses_existing_private_owner_without_opening_another_store', 'tests.test_cli.CliTests.test_unexpected_connection_failure_revokes_runtime_admission_in_memory']
          (out/'argv.json').write_text(json.dumps(argv)+'\n')
          (out/'native-identity.json').write_text(json.dumps({'python':sys.version,'executable':sys.executable,'kernel':platform.uname()._asdict(),'pidfd_open':hasattr(os,'pidfd_open'),'uid':os.getuid(),'euid':os.geteuid(),'gid':os.getgid(),'egid':os.getegid(),'home':str(pathlib.Path.home()),'tmpdir':str(pathlib.Path(owner['fixture'])/'tmp')},sort_keys=True)+'\n')
          assert sys.platform=='linux' and hasattr(os,'pidfd_open')
          assert time.monotonic()<owner['work_end']-125,'original work window exhausted before invocation'
          PYSOURCE
      - name: Run the six exact owning Linux cases once
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            OUT="$OUT" FIXTURE="$FIXTURE" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" /usr/bin/python3 -B - <<'PYWORK'
          import json,os,pathlib,signal,subprocess,time
          out=pathlib.Path(os.environ['OUT']);owner=json.loads((out/'ownership.json').read_text());started=time.monotonic()
          assert os.getuid()==os.geteuid()==os.getgid()==os.getegid()==0 and pathlib.Path.home()==pathlib.Path('/root')
          p=None;rc=None;natural=False;group_absent=False;forced=False
          try:
              remaining=owner['work_end']-time.monotonic()
              if remaining<125:raise RuntimeError('original work window exhausted')
              argv=json.loads((out/'argv.json').read_text())
              env={'PATH':'/usr/sbin:/usr/bin:/sbin:/bin','LANG':'C.UTF-8'}
              env.update(PYTHONDONTWRITEBYTECODE='1',PYTHONPATH=str(pathlib.Path.cwd()/'src'),TMPDIR=str(pathlib.Path(owner['fixture'])/'tmp'))
              with (out/'work.stdout').open('xb') as stdout,(out/'work.stderr').open('xb') as stderr:
                  p=subprocess.Popen(argv,stdout=stdout,stderr=stderr,env=env,start_new_session=True)
                  (out/'process.json').write_text(json.dumps({'pid':p.pid,'pgid':p.pid,'start_epoch':time.time(),'start_monotonic':time.monotonic(),'owner_uid':os.geteuid(),'owner_gid':os.getegid()})+'\n')
                  try:rc=p.wait(timeout=min(120,owner['work_end']-time.monotonic()-4));natural=True
                  except subprocess.TimeoutExpired:pass
          finally:
              if p is not None:
                  try:
                      os.killpg(p.pid,0);forced=True;os.killpg(p.pid,signal.SIGTERM)
                      until=min(time.monotonic()+2,owner['work_end']-2)
                      while time.monotonic()<until:
                          try:os.killpg(p.pid,0)
                          except ProcessLookupError:break
                          time.sleep(.05)
                      try:os.killpg(p.pid,signal.SIGKILL)
                      except ProcessLookupError:pass
                  except ProcessLookupError:pass
                  try:p.wait(timeout=max(.01,min(2,owner['work_end']-time.monotonic())))
                  except subprocess.TimeoutExpired:pass
                  try:os.killpg(p.pid,0)
                  except ProcessLookupError:group_absent=True
              (out/'process-closure.json').write_text(json.dumps({'natural_exit':natural,'returncode':rc,'group_absent':group_absent,'forced_group_stop':forced,
                  'creating_process_reaped':p is not None and p.poll() is not None,'elapsed_seconds':time.monotonic()-started,'finished_monotonic':time.monotonic()})+'\n')
          if not(natural and rc==0 and group_absent and not forced):raise SystemExit(1)
          PYWORK
      - name: Preserve closure and require exact case census
        if: always() && steps.owned.outputs.owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            OUT="$OUT" FIXTURE="$FIXTURE" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" /usr/bin/python3 -B - <<'PYCLOSE'
          import hashlib,json,os,pathlib,re,shutil,stat,subprocess,time
          out=pathlib.Path(os.environ['OUT']);owner=json.loads((out/'ownership.json').read_text());errors=[]
          assert os.getuid()==os.geteuid()==os.getgid()==os.getegid()==0
          def record(name,value):(out/name).write_text(json.dumps(value,sort_keys=True)+'\n')
          def require(value,label):
              if not value:errors.append(label)
          process=json.loads((out/'process.json').read_text()) if (out/'process.json').exists() else None
          absent=process is None
          if process is not None:
              try:os.killpg(process['pgid'],0)
              except ProcessLookupError:absent=True
          require(absent,'owned process group remains')
          rows={};home=pathlib.Path(owner['home']);census_ok=True
          with os.scandir(home) as entries:
              for count,entry in enumerate(entries):
                  if count>=2047:census_ok=False;break
                  if entry.name.startswith(('.nodus-partition-','.nodus-api-')):
                      s=entry.stat(follow_symlinks=False);rows[entry.name]=[s.st_dev,s.st_ino,s.st_uid,s.st_mode]
          record('home-after.json',{'complete':census_ok,'rows':rows})
          require(census_ok and rows==owner['home_before'],'test-owned home fixture survivor or identity drift')
          fixture=pathlib.Path(owner['fixture']);removed=False
          expected=pathlib.Path('/root')/f"managed-local-root-fixture-{owner['run_id']}-{owner['attempt']}"
          run_ok=owner['run_id']==os.environ['GITHUB_RUN_ID'] and owner['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          path_ok=fixture==expected and fixture==pathlib.Path(os.environ['FIXTURE'])
          require(run_ok,'fixture run identity');require(path_ok,'fixture path')
          st=fixture.lstat();actual=[st.st_dev,st.st_ino,st.st_uid,stat.S_IMODE(st.st_mode)]
          identity_ok=stat.S_ISDIR(st.st_mode) and actual==owner['fixture_identity'] and st.st_uid==os.geteuid()
          require(identity_ok,'fixture inode ownership')
          if run_ok and path_ok and identity_ok and absent:
              assert shutil.rmtree.avoids_symlink_attacks
              shutil.rmtree(fixture);removed=not fixture.exists() and not fixture.is_symlink()
          require(removed,'owned fixture not removed')
          record('fixture-closure.json',{'group_absent':absent,'home_census_complete':census_ok,'home_matches_before':rows==owner['home_before'],
                 'fixture_identity':actual,'fixture_removed':removed,'errors':list(errors)})
          source=subprocess.run(['git','-c','safe.directory='+str(pathlib.Path.cwd()),'status','--porcelain=v1','--untracked-files=all'],capture_output=True,timeout=10)
          (out/'source-after.txt').write_bytes(source.stdout);(out/'source-after.stderr').write_bytes(source.stderr)
          require(source.returncode==0 and not source.stdout and not source.stderr,'source changed or status failed')
          selected=json.loads((out/'argv.json').read_text())[5:] if (out/'argv.json').exists() else []
          raw=(out/'work.stderr').read_bytes() if (out/'work.stderr').exists() else b''
          require(len(raw)<=4*1024*1024,'case log bound')
          log=raw.decode('utf-8',errors='strict');cases=[]
          headers=re.findall(r'^(test_\w+) \(([^)]+)\)',log,re.M)
          for case in selected:
              cls,method=case.rsplit('.',1)
              pattern=r'^'+re.escape(method)+r' \('+re.escape(cls)+r'(?:\.'+re.escape(method)+r')?\)(?:\n[^\n]*)? \.\.\. ok$'
              cases.append({'name':case,'ok':len(re.findall(pattern,log,re.M))==1})
          require(len(selected)==6 and len(headers)==6 and all(row['ok'] for row in cases),'six exact case results')
          require(len(re.findall(r'^Ran 6 tests in [0-9.]+s$',log,re.M))==1 and log.rstrip().endswith('\nOK'),'unittest summary')
          require(not re.search(r'^(?:FAIL|ERROR|FAILED|OK \(|UNEXPECTED SUCCESS)|\.\.\. (?:skipped|expected failure|FAIL|ERROR|unexpected success)',log,re.M),'negative or skipped case')
          closure=json.loads((out/'process-closure.json').read_text()) if (out/'process-closure.json').exists() else {}
          require(closure.get('natural_exit') is True and closure.get('returncode')==0 and closure.get('group_absent') is True and closure.get('forced_group_stop') is False and closure.get('creating_process_reaped') is True,'natural process closure')
          require(closure.get('finished_monotonic',float('inf'))<=owner['work_end'],'original work end')
          require(owner['owner_uid']==owner['owner_gid']==0 and owner['home']=='/root' and process is not None and process['owner_uid']==process['owner_gid']==0,'privileged owner identity')
          require(time.monotonic()<owner['job_end']-60,'collection/upload reserve exhausted')
          record('qualification.json',{'contract':'managed-local-oss-selective-cpu.v1','product_head':'394f3b32de15de96b7002ebc448ed608aeb9ac29',
                 'workflow_head':os.environ['GITHUB_SHA'],'run_id':owner['run_id'],'run_attempt':owner['attempt'],'cases':cases,'errors':errors,'passed':not errors,
                 'scope':'Linux Unix/SQLite and CLI; synthetic provider only; no Go, real enforcement, GPU or publication qualification'})
          if errors:raise SystemExit('; '.join(errors))
          PYCLOSE
      - name: Hand back only bounded owned evidence for upload
        if: always() && steps.owned.outputs.owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            OUT="$OUT" FIXTURE="$FIXTURE" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" /usr/bin/python3 -B - <<'PYHANDBACK'
          import hashlib,json,os,pathlib,stat,time
          out=pathlib.Path(os.environ['OUT']);owner=json.loads((out/'ownership.json').read_text())
          assert os.geteuid()==os.getegid()==0 and time.monotonic()<owner['job_end']-60
          expected=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/f"managed-local-root-evidence-{owner['run_id']}-{owner['attempt']}"
          assert out==expected and owner['run_id']==os.environ['GITHUB_RUN_ID'] and owner['attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          fd=os.open(out,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
          try:
              st=os.fstat(fd);identity=[st.st_dev,st.st_ino,st.st_uid,stat.S_IMODE(st.st_mode)]
              assert identity==owner['output_identity'] and st.st_uid==st.st_gid==0
              names=sorted(os.listdir(fd));assert len(names)<=30 and 'handback.json' not in names and 'SHA256SUMS' not in names
              rows=[];total=0
              for name in names:
                  assert pathlib.Path(name).name==name
                  item=os.open(name,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=fd)
                  try:
                      info=os.fstat(item);assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_uid==info.st_gid==0 and info.st_size<=8<<20
                      total+=info.st_size;assert total<=16<<20
                      rows.append({'name':name,'bytes':info.st_size,'device':info.st_dev,'inode':info.st_ino})
                  finally:os.close(item)
              for row in rows:
                  item=os.open(row['name'],os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=fd)
                  try:
                      info=os.fstat(item);assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_uid==info.st_gid==0
                      assert (info.st_dev,info.st_ino,info.st_size)==(row['device'],row['inode'],row['bytes'])
                      os.fchmod(item,0o600);os.fchown(item,owner['runner_uid'],owner['runner_gid'])
                  finally:os.close(item)
              current=out.lstat();assert (current.st_dev,current.st_ino)==(st.st_dev,st.st_ino)
              os.fchmod(fd,0o700);os.fchown(fd,owner['runner_uid'],owner['runner_gid'])
              final=os.fstat(fd);assert (final.st_uid,final.st_gid,stat.S_IMODE(final.st_mode))==(owner['runner_uid'],owner['runner_gid'],0o700)
              for row in rows:
                  final=os.stat(row['name'],dir_fd=fd,follow_symlinks=False)
                  assert (final.st_dev,final.st_ino,final.st_size,final.st_uid,final.st_gid,stat.S_IMODE(final.st_mode))==(row['device'],row['inode'],row['bytes'],owner['runner_uid'],owner['runner_gid'],0o600)
              def output_file(name):
                  item=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600,dir_fd=fd)
                  os.fchown(item,owner['runner_uid'],owner['runner_gid']);return os.fdopen(item,'w')
              record={'passed':True,'source_uid':0,'runner_uid':owner['runner_uid'],'runner_gid':owner['runner_gid'],'files':rows,'bytes':total,'directory_identity':identity,'recursive_chown':False}
              with output_file('handback.json') as output:json.dump(record,output,sort_keys=True);output.write('\n')
              with output_file('SHA256SUMS') as sums:
                  for name in sorted([*names,'handback.json']):sums.write(hashlib.sha256((out/name).read_bytes()).hexdigest()+'  '+name+'\n')
          finally:os.close(fd)
          PYHANDBACK
      - name: Retain bounded positive or negative evidence
        if: always() && steps.owned.outputs.owned == 'true'
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-local-oss-root-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
          retention-days: 7
  service-control:
    if: github.repository == 'nodus-compute/nodus-dc' && github.event.repository.private == false && github.ref != 'refs/heads/codex/managed-local-oss-root-native-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact independently reviewed package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fdfa300dd2856ac29c1464fb608eb8bfa4882e0d
          path: candidate
          persist-credentials: false
      - name: Download the published artifacts and verify their source rebuild
        run: python3 qualification/systemd/prepare.py --candidate candidate --output evidence/prepared
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify separate public nodusd release signature and protocol executable
        id: signed-agent
        continue-on-error: true # Preserve independent service observations; final assessor requires both gates.
        run: python3 qualification/systemd/verify_agent.py --output evidence/signed-agent
      - name: Install the exact wheel offline into a new owned directory
        id: install
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          root="/var/lib/nodus-dc-systemd-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo test ! -e "$root"
          sudo install -d -m 0700 "$root"
          sudo install -m 0600 qualification/systemd/systemd_fixture.py qualification/systemd/bindings.json "$root/"
          printf 'owned=true\n' >> "$GITHUB_OUTPUT"
          sudo install -m 0600 candidate/tools/install.py "$root/install.py"
          sudo install -m 0600 evidence/prepared/legacy-install.py evidence/prepared/nodus_datacenter-0.1.0.dev1-py3-none-any.whl "$root/"
          sudo python3 "$root/install.py" install --prefix "$root/install" --state-dir "$root/state" \
            --wheel "$root/nodus_datacenter-0.1.0.dev1-py3-none-any.whl" > evidence/install-legacy.json
          sudo python3 "$root/install.py" install --prefix "$root/install" --state-dir "$root/state" \
            --wheel "$PWD/evidence/prepared/nodus_datacenter-0.1.0.dev3-py3-none-any.whl" > evidence/install.json
          sudo "$root/install/current/bin/nodus-dc" --version > evidence/nodus-dc-version.txt
          sudo "$root/install/current/bin/nodus-dc" native-return --help > evidence/native-return-help.txt
      - name: Actual systemd lifecycle with representative worker and installed LinuxAgent
        shell: bash
        run: |
          set -euo pipefail
          root="/var/lib/nodus-dc-systemd-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          timeout --signal=TERM --kill-after=20s 180s sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            "$root/install/current/bin/python" -I "$root/systemd_fixture.py" --root "$root"
      - name: Stop and remove only the owned fixture unit, preserve raw evidence
        if: always() && steps.install.outputs.owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="/var/lib/nodus-dc-systemd-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup=0
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            python3 -I "$root/systemd_fixture.py" --root "$root" --cleanup || cleanup=$?
          mkdir -p evidence/systemd
          if sudo test -d "$root/evidence"; then
            sudo cp -a "$root/evidence/." evidence/systemd/
            sudo chown -R "$(id -u):$(id -g)" evidence/systemd
          fi
          exit "$cleanup"
      - name: Require all exact cases, cleanup and independent artifact evidence
        if: always()
        run: python3 qualification/systemd/assess.py --evidence evidence
      - name: Retain positive and negative evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-service-control-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            !evidence/signed-agent/nodusd
            !evidence/signed-agent/nodusd.altered
          if-no-files-found: error
          retention-days: 7
